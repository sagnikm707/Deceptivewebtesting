<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Download</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Confirm Download</h1>

        <p>
            Your document is ready.
        </p>

        <p>
            Click the button below to download your document.
        </p>

        <div class="overlap-area">

            <!-- Visible download button -->
            <a href="payment.html" class="download-button">
                Confirm Download
            </a>

            <!-- Intentionally overlapping payment button -->
            <a href="payment.html" class="payment-button">
                Pay Now
            </a>

        </div>

        <div class="hidden-content">
            PAYMENT REQUIRED
        </div>

        <div class="hidden-content">
            PAYMENT AUTHORIZATION
        </div>

        <p class="test-notice">
            TEST PAGE — No real payment is processed.
        </p>

    </div>

</div>

</body>
</html>
